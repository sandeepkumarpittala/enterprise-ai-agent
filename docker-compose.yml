services:
  postgres:
    image: postgres:18.6
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: enterprise_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
